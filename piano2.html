<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>WebSocket 鋼琴五線譜</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    body { background: #fff; font-family: sans-serif; text-align: center; margin: 0; }
    h1 { background: #000; color: #fff; padding: 10px; }
    #staff {
      margin-top: 20px;
      position: relative;
      height: 200px;
      background: url('https://upload.wikimedia.org/wikipedia/commons/4/4f/Staff_notation_empty.png') no-repeat center;
      background-size: contain;
    }
    .note {
      position: absolute;
      width: 30px;
      height: 30px;
      background: url('https://upload.wikimedia.org/wikipedia/commons/6/60/Music_note_icon.png') no-repeat center;
      background-size: contain;
      animation: drop 2s ease-out;
    }
    @keyframes drop {
      0% { transform: translateY(-50px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>
  <h1>🎹 鋼琴互動任務</h1>
  <div id="staff"></div>

  <audio id="Do" src="notes/do.mp3"></audio>
  <audio id="Re" src="notes/re.mp3"></audio>
  <audio id="Mi" src="notes/mi.mp3"></audio>
  <audio id="Fa" src="notes/fa.mp3"></audio>
  <audio id="Sol" src="notes/sol.mp3"></audio>
  <audio id="La" src="notes/la.mp3"></audio>
  <audio id="Si" src="notes/si.mp3"></audio>

  <script>
    const positions = { Do: 120, Re: 110, Mi: 100, Fa: 90, Sol: 80, La: 70, Si: 60 };

    function playNote(note) {
      const sound = document.getElementById(note);
      if (sound) sound.play();

      const el = document.createElement("div");
      el.className = "note";
      el.style.left = Math.random() * 80 + "%";
      el.style.top = positions[note] + "px";
      document.getElementById("staff").appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }

    // WebSocket 連線
    const ws = new WebSocket("ws://172.20.10.2/ws");  // 修改成 ESP32 IP

    ws.onopen = () => console.log("✅ WebSocket 已連接");
    ws.onmessage = e => {
      const msg = e.data;
      if (msg.startsWith("note:")) {
        const note = msg.split(":")[1];
        playNote(note);
      }
    };
    ws.onerror = e => console.error("WebSocket 錯誤", e);
  </script>
</body>
</html>
