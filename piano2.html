<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>Memo Quest 鋼琴</title>
  <style>
    body {
      margin: 0;
      font-family: 'Playfair Display', serif;
      background-color: #1c1c2e;
      color: #d4af37;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px;
    }
    h1 {
      font-size: 48px;
      margin: 0;
    }
    #staff {
      background: white;
      width: 90%;
      height: 200px;
      margin: 40px 0;
      position: relative;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
    }
    .line {
      position: absolute;
      left: 0;
      width: 100%;
      height: 1px;
      background: #333;
    }
    .note {
      width: 20px;
      height: 20px;
      background: black;
      border-radius: 50%;
      position: absolute;
      transition: all 0.3s ease;
    }
    button {
      background: #d4af37;
      border: none;
      color: black;
      font-size: 20px;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Memo<br>Quest</h1>
  <div id="staff">
    <!-- 五線譜線條 -->
    <div class="line" style="top: 30px"></div>
    <div class="line" style="top: 60px"></div>
    <div class="line" style="top: 90px"></div>
    <div class="line" style="top: 120px"></div>
    <div class="line" style="top: 150px"></div>
  </div>
  <button onclick="clearNotes()">清除音符</button>

  <!-- 音效 -->
  <audio id="C" src="notes/C.mp3"></audio>
  <audio id="D" src="notes/D.mp3"></audio>
  <audio id="E" src="notes/E.mp3"></audio>
  <audio id="F" src="notes/F.mp3"></audio>
  <audio id="G" src="notes/G.mp3"></audio>
  <audio id="A" src="notes/A.mp3"></audio>
  <audio id="B" src="notes/B.mp3"></audio>

  <script>
    // 音符位置對應（五線譜位置）
    const noteY = {
      C: 170,
      D: 155,
      E: 140,
      F: 125,
      G: 110,
      A: 95,
      B: 80
    };

    function showNote(note) {
      const staff = document.getElementById("staff");
      const dot = document.createElement("div");
      dot.className = "note";
      dot.style.left = `${Math.random() * (staff.clientWidth - 20)}px`;
      dot.style.top = `${noteY[note] || 140}px`;
      staff.appendChild(dot);

      const sound = document.getElementById(note);
      if (sound) sound.play();
    }

    function clearNotes() {
      document.querySelectorAll('.note').forEach(n => n.remove());
    }

    // 讀取 URL note 參數（ESP32 傳來的）
    const params = new URLSearchParams(location.search);
    const note = params.get("note");
    if (note) {
      showNote(note);
    }
  </script>
</body>
</html>
